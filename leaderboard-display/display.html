<!DOCTYPE html>
<html>
    <head>
        <title>ChronoQuest Leaderboard</title>
        <link rel="stylesheet" type="text/css" href="/display.css">
    </head>

    <body> 
        <h1>ChronoQuest Leaderboard</h1>

        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-table">
            </tbody>        
        </table>

        <script>
            async function loadLeaderboard() {
                const response = await fetch("http://127.0.0.1:8000/leaderboard");
                const data = await response.json(); 

                const table = document.getElementById("leaderboard-table"); 
                table.innerHTML = "";

                data.forEach(entry => {
                    const row = `<tr>
                        <td>${entry.name}</td>
                        <td>${entry.score}</td>
                    </tr>`;
                    table.innerHTML += row;
                })
            }
            
            loadLeaderboard(); 
            setInterval(loadLeaderboard, 2000); 
        </script>
    </body>
</html>
