<!DOCTYPE html>
<html>
    <head>
        <title>ChronoQuest Leaderboard</title>
        <link rel="stylesheet" href="{{ url_for('static', path='display.css') }}">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    </head>

    <body> 
        <h1>ChronoQuest Leaderboard</h1>

        <div class="leaderboard-container">
            <table border="1">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-table">
                </tbody>        
            </table>
        </div>

        <script>
            let previousData = [];
            let isFirstLoad = true; 
            
            async function loadLeaderboard() {
                const response = await fetch("/leaderboard");
                const data = await response.json(); 

                const hasNewEntry = 
                    previousData.length === 0 ||
                    data.length !== previousData.length ||
                    data.some((entry, i) =>
                        !previousData[i] ||
                        entry.name !== previousData[i].name || 
                        entry.score !== previousData[i].score
                    ); 

                if (!hasNewEntry && !isFirstLoad) return; 
                
                renderLeaderboard(data);
                previousData = data;
            }

            function animateScore(el, finalScore) {
                if (el._animating) return; 
                el._animating = true; 
                
                let current = 0; 
                const duration = 500; 
                const steps = 30; 
                const increment = finalScore / steps;
                const stepTime = duration / steps;  

                const interval = setInterval(() => {
                    current += increment; 

                    if (current >= finalScore) {
                        el.innerText = finalScore; 
                        clearInterval(interval); 
                    } else {
                        el.innerText = Math.floor(current); 
                    }
                }, stepTime);
            }

            function renderLeaderboard(data) {
                const table = document.getElementById("leaderboard-table"); 
                table.innerHTML = "";

                data.forEach((entry, index) => {
                    const row = document.createElement("tr");
                    row.setAttribute("data-rank", entry.rank); 

                    const isNew = !previousData.some(p => 
                        p.name === entry.name && p.score === entry.score
                    );
                    
                    if (isFirstLoad || isNew) {
                        row.classList.add("fade-in");
                    }

                    row.innerHTML = `
                        <td class="rank" data-rank="${entry.rank}">${entry.rank}</td>
                        <td>${entry.name}</td>
                        <td class="score"></td>
                    `;

                    table.appendChild(row);

                    const scoreCell = row.querySelector(".score"); 

                    if (isFirstLoad || isNew) {
                        animateScore(scoreCell, entry.score);
                    } else {
                        scoreCell.innerText = entry.score; 
                    }

                    row.style.animationDelay = `${index * 0.1}s`;
                }); 

                isFirstLoad = false; 
            }

            loadLeaderboard(); 
            setInterval(loadLeaderboard, 2000); 
        </script>
    </body>
</html>
